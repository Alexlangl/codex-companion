name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.1 or v0.1.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  PRODUCT_NAME: codex-companion
  CLI_PACKAGE: codex-companion-cli
  TUI_PACKAGE: codex-companion-tui

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        name: Validate version
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_INPUT#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${RELEASE_INPUT}. Use 0.1.1 or v0.1.1." >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

  cli:
    name: CLI and TUI ${{ matrix.suffix }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
            archive_ext: tar.gz
            exe_ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x64
            archive_ext: tar.gz
            exe_ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            archive_ext: tar.gz
            exe_ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
            archive_ext: tar.gz
            exe_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64
            archive_ext: zip
            exe_ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Apply release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/set-release-version.mjs "${RELEASE_VERSION}"

      - name: Build command-line archive
        shell: bash
        env:
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          ARTIFACT_SUFFIX: ${{ matrix.suffix }}
          EXE_EXT: ${{ matrix.exe_ext }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RUST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ARCHIVE="${PRODUCT_NAME}-${RELEASE_VERSION}-${ARTIFACT_SUFFIX}.${ARCHIVE_EXT}"
          STAGING="dist-work/${PRODUCT_NAME}-${RELEASE_VERSION}-${ARTIFACT_SUFFIX}"
          mkdir -p release-assets "${STAGING}"

          cargo build \
            -p "${CLI_PACKAGE}" \
            -p "${TUI_PACKAGE}" \
            --release \
            --target "${RUST_TARGET}"

          cp "target/${RUST_TARGET}/release/codex-companion${EXE_EXT}" "${STAGING}/"
          cp "target/${RUST_TARGET}/release/codex-companion-tui${EXE_EXT}" "${STAGING}/"
          cp README.md README.en.md LICENSE "${STAGING}/"

          if [[ "${ARCHIVE_EXT}" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${STAGING}/*' -DestinationPath 'release-assets/${ARCHIVE}'"
          else
            tar -C "${STAGING}" -czf "release-assets/${ARCHIVE}" .
          fi

      - name: Upload command-line artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-cli-${{ matrix.suffix }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  app:
    name: App ${{ matrix.suffix }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            suffix: macos-universal
          - os: macos-latest
            args: --target x86_64-apple-darwin
            suffix: macos-x64
          - os: macos-latest
            args: --target aarch64-apple-darwin
            suffix: macos-arm64
          - os: windows-latest
            args: ""
            suffix: windows-x64
          - os: ubuntu-latest
            args: ""
            suffix: linux-x64
          - os: ubuntu-24.04-arm
            args: ""
            suffix: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.23.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/set-release-version.mjs "${RELEASE_VERSION}"

      - name: Build Tauri bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY repository secret" >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            if pnpm --filter @codex-companion/desktop tauri build ${{ matrix.args }}; then
              exit 0
            fi

            if [[ "${attempt}" == "3" ]]; then
              exit 1
            fi

            sleep $((attempt * 20))
          done

      - name: Normalize app artifact names
        env:
          CODEX_COMPANION_ARTIFACT_SUFFIX: ${{ matrix.suffix }}
          CODEX_COMPANION_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/rename-tauri-artifacts.mjs

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-app-${{ matrix.suffix }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - cli
      - app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate updater manifest
        env:
          CODEX_COMPANION_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/generate-updater-manifest.mjs

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Codex Companion ${{ needs.prepare.outputs.tag }}
          body: Desktop bundles and CLI/TUI archives built by the manual release workflow.
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          fail_on_unmatched_files: true
          preserve_order: true
          files: release-assets/*

  homebrew:
    name: Update Homebrew tap
    if: needs.prepare.outputs.prerelease == 'false'
    needs:
      - prepare
      - cli
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Download command-line archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-cli-*
          path: release-assets
          merge-multiple: true

      - name: Configure Homebrew tap deploy key
        shell: bash
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_DEPLOY_KEY}" ]]; then
            echo "Missing HOMEBREW_TAP_DEPLOY_KEY repository secret" >&2
            exit 1
          fi

          KEY_PATH="${RUNNER_TEMP}/homebrew-tap-deploy-key"
          KNOWN_HOSTS_PATH="${RUNNER_TEMP}/homebrew-tap-known-hosts"
          printf '%s\n' "${HOMEBREW_TAP_DEPLOY_KEY}" > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"
          ssh-keyscan github.com > "${KNOWN_HOSTS_PATH}"
          echo "GIT_SSH_COMMAND=ssh -i ${KEY_PATH} -o IdentitiesOnly=yes -o UserKnownHostsFile=${KNOWN_HOSTS_PATH}" >> "${GITHUB_ENV}"

      - name: Update Formula
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ARM_MAC_ARCHIVE="${PRODUCT_NAME}-${RELEASE_VERSION}-macos-arm64.tar.gz"
          X64_MAC_ARCHIVE="${PRODUCT_NAME}-${RELEASE_VERSION}-macos-x64.tar.gz"
          ARM_LINUX_ARCHIVE="${PRODUCT_NAME}-${RELEASE_VERSION}-linux-arm64.tar.gz"
          X64_LINUX_ARCHIVE="${PRODUCT_NAME}-${RELEASE_VERSION}-linux-x64.tar.gz"
          ARM_MAC_SHA="$(sha256sum "release-assets/${ARM_MAC_ARCHIVE}" | awk '{print $1}')"
          X64_MAC_SHA="$(sha256sum "release-assets/${X64_MAC_ARCHIVE}" | awk '{print $1}')"
          ARM_LINUX_SHA="$(sha256sum "release-assets/${ARM_LINUX_ARCHIVE}" | awk '{print $1}')"
          X64_LINUX_SHA="$(sha256sum "release-assets/${X64_LINUX_ARCHIVE}" | awk '{print $1}')"
          BASE_URL="https://github.com/Alexlangl/${PRODUCT_NAME}/releases/download/v${RELEASE_VERSION}"

          git clone git@github.com:Alexlangl/homebrew-tap.git tap
          mkdir -p tap/Formula
          cat > tap/Formula/codex-companion.rb <<EOF
          class CodexCompanion < Formula
            desc "Local provider runtime, relay, and state continuity tool for Codex"
            homepage "https://github.com/Alexlangl/codex-companion"
            version "${RELEASE_VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/${ARM_MAC_ARCHIVE}"
                sha256 "${ARM_MAC_SHA}"
              else
                url "${BASE_URL}/${X64_MAC_ARCHIVE}"
                sha256 "${X64_MAC_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE_URL}/${ARM_LINUX_ARCHIVE}"
                sha256 "${ARM_LINUX_SHA}"
              else
                url "${BASE_URL}/${X64_LINUX_ARCHIVE}"
                sha256 "${X64_LINUX_SHA}"
              end
            end

            def install
              bin.install "codex-companion"
              bin.install "codex-companion-tui"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/codex-companion --version")
              assert_path_exists bin/"codex-companion-tui"
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/codex-companion.rb
          if git diff --cached --quiet; then
            echo "Homebrew Formula is already up to date"
          else
            git commit -m "Update codex-companion to ${RELEASE_VERSION}"
            git push
          fi
