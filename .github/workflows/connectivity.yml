name: Connectivity regression tests

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/connectivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Proxy, login preservation and WebSocket regressions
        run: cargo test --locked -p codex-companion-core -p codex-companion-daemon -p codex-companion-relay -p codex-companion-state --lib -- --test-threads=1
