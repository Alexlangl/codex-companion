[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/cli",
  "crates/core",
  "crates/daemon",
  "crates/health",
  "crates/provider",
  "crates/relay",
  "crates/state",
  "crates/tui",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Alexlangl/codex-companion"
homepage = "https://github.com/Alexlangl/codex-companion"
description = "Local provider runtime, relay, and state continuity tool for Codex"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
brotli = "8.0"
bytes = "1.11"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
codex-companion-core = { path = "crates/core" }
codex-companion-daemon = { path = "crates/daemon" }
codex-companion-health = { path = "crates/health" }
codex-companion-provider = { path = "crates/provider" }
codex-companion-relay = { path = "crates/relay" }
codex-companion-state = { path = "crates/state" }
crossterm = "0.29"
crypto_box = { version = "0.9.1", features = ["seal", "std"] }
dirs = "6.0"
ed25519-dalek = { version = "2.2", features = ["pkcs8", "rand_core"] }
futures-util = "0.3"
flate2 = "1.1"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rquickjs = { version = "0.8", features = ["array-buffer", "classes"] }
rand = "0.9"
regex = "1.12"
rust_decimal = { version = "1.39", default-features = false, features = ["std"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
system-configuration = "0.7"
tauri = { version = "2.11", features = [] }
tauri-build = { version = "2.6", features = [] }
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tempfile = "3.23"
thiserror = "2.0"
tiny_http = "0.12"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
toml_edit = "0.23"
tower-http = { version = "0.6", features = ["cors"] }
url = "2.5"
walkdir = "2.5"
zstd = "0.13"
